# FinCompass — Render Blueprint (backend API)
# Deploy: Render Dashboard → New → Blueprint → connect https://github.com/Adityaparida123/fincompass
#
# Runtime datastore is MongoDB Atlas (MONGODB_URI is set as a secret below).
# Redis (keyvalue) is still required for rate limiting + caching.

services:
  - type: web
    name: finai-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: fincompass
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finai-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://fincompass-three.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: '^https://fincompass-[a-z0-9]+-adityaparidaomm-3447s-projects\.vercel\.app$'
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: DEFAULT_CURRENCY
        value: INR
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_CHAT_LIMIT
        value: "30"
      - key: RATE_LIMIT_CHAT_WINDOW
        value: "60"
      - key: RATE_LIMIT_ML_LIMIT
        value: "60"
      - key: RATE_LIMIT_ML_WINDOW
        value: "60"
      - key: RATE_LIMIT_REGISTER_LIMIT
        value: "5"
      - key: RATE_LIMIT_REGISTER_WINDOW
        value: "900"
      - key: RATE_LIMIT_REGISTER_EMAIL_LIMIT
        value: "3"
      - key: RATE_LIMIT_REGISTER_EMAIL_WINDOW
        value: "900"
      - key: RATE_LIMIT_LOGIN_LIMIT
        value: "10"
      - key: RATE_LIMIT_LOGIN_WINDOW
        value: "60"
      - key: RATE_LIMIT_LOGIN_EMAIL_LIMIT
        value: "5"
      - key: RATE_LIMIT_LOGIN_EMAIL_WINDOW
        value: "300"
      - key: RATE_LIMIT_REFRESH_LIMIT
        value: "30"
      - key: RATE_LIMIT_REFRESH_WINDOW
        value: "60"
      - key: RATE_LIMIT_FORGOT_LIMIT
        value: "5"
      - key: RATE_LIMIT_FORGOT_WINDOW
        value: "3600"
      - key: RATE_LIMIT_FORGOT_EMAIL_LIMIT
        value: "3"
      - key: RATE_LIMIT_FORGOT_EMAIL_WINDOW
        value: "3600"
      - key: RATE_LIMIT_RESET_LIMIT
        value: "5"
      - key: RATE_LIMIT_RESET_WINDOW
        value: "3600"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://fincompass-three.vercel.app

  - type: keyvalue
    name: finai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
