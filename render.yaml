# FinCompass — Render Blueprint (backend API)
# Deploy: Render Dashboard → New → Blueprint → connect https://github.com/Adityaparida123/fincompass

databases:
  - name: finai-db
    plan: free
    databaseName: finai
    user: finai

services:
  - type: web
    name: finai-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: finai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finai-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://fincompass-three.vercel.app
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: DEFAULT_CURRENCY
        value: INR
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: keyvalue
    name: finai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
