    <circle cx="512" cy="512" r="400" stroke-width="56"/>
    <circle cx="512" cy="512" r="312" stroke-width="16" opacity="0.45"/>
    <!-- cardinal ticks -->
    <g stroke-width="28" opacity="0.85">
      <line x1="512" y1="132" x2="512" y2="212"/>
      <line x1="512" y1="812" x2="512" y2="892"/>
      <line x1="132" y1="512" x2="212" y2="512"/>
      <line x1="812" y1="512" x2="892" y2="512"/>
