    <g stroke-width="14" opacity="0.4">
      <line x1="259" y1="259" x2="315" y2="315"/>
      <line x1="765" y1="259" x2="709" y2="315"/>
      <line x1="259" y1="765" x2="315" y2="709"/>
      <line x1="765" y1="765" x2="709" y2="709"/>
